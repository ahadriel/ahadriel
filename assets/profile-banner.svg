<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Hadriel — build with intention</title>
<desc id="desc">An editorial technology banner with a deep navy canvas, seafoam accents, a sculptural eclipse and precise geometric line work.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080F1B"/><stop offset=".6" stop-color="#0C1826"/><stop offset="1" stop-color="#111F2D"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D0F0E6"/><stop offset=".48" stop-color="#91D8C6"/><stop offset="1" stop-color="#4C9E92"/></linearGradient>
  <linearGradient id="sphere" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263C4B"/><stop offset=".55" stop-color="#152B39"/><stop offset="1" stop-color="#0A1521"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#7DD3C0" stop-opacity=".18"/><stop offset="1" stop-color="#7DD3C0" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#AFC9D4" stroke-opacity=".055" stroke-width=".7"/></pattern>
  <clipPath id="clip"><rect width="1200" height="430" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="430" fill="url(#bg)"/>
<rect width="1200" height="430" fill="url(#grid)"/>
<circle cx="900" cy="215" r="290" fill="url(#glow)"/>
<!-- subtle architectural framing -->
<path d="M64 72V54H82M1118 54H1136V72M64 358V376H82M1118 376H1136V358" fill="none" stroke="#8CCFC0" stroke-opacity=".55" stroke-width="1.2"/>
<path d="M64 100H320M64 106H180M880 376H1136" stroke="#7C93A8" stroke-opacity=".2"/>
<text x="78" y="82" fill="#9AB1C0" font-family="Consolas,monospace" font-size="10" letter-spacing="2.5">PERSONAL PORTFOLIO / 2026</text>
<text x="1120" y="82" fill="#9AB1C0" font-family="Consolas,monospace" font-size="10" letter-spacing="2" text-anchor="end">INDEPENDENT BY DESIGN</text>
<!-- sculptural orbital form -->
<g transform="translate(890 219)">
  <circle r="184" fill="none" stroke="#8CCFC0" stroke-opacity=".17" stroke-width="1"/>
  <circle r="156" fill="none" stroke="#8CCFC0" stroke-opacity=".28" stroke-width="1" stroke-dasharray="1 8"/>
  <ellipse rx="205" ry="72" transform="rotate(-33)" fill="none" stroke="#8CCFC0" stroke-opacity=".42" stroke-width="1.1"/>
  <ellipse rx="205" ry="72" transform="rotate(33)" fill="none" stroke="#8CCFC0" stroke-opacity=".22" stroke-width="1.1"/>
  <circle r="116" fill="url(#sphere)" stroke="#9ADBCB" stroke-opacity=".5" stroke-width="1.2"/>
  <circle r="99" fill="none" stroke="#B9E8DC" stroke-opacity=".12"/>
  <path d="M-80 -74A109 109 0 0 1 80 -74" fill="none" stroke="url(#mint)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="18" cy="-14" r="69" fill="url(#mint)" opacity=".9"/>
  <circle cx="47" cy="-38" r="69" fill="#10202D"/>
  <path d="M-56 51Q0 12 56 51" fill="none" stroke="#9ADBCB" stroke-opacity=".18"/>
  <circle cx="-147" cy="-84" r="3" fill="#BDEADD"/>
  <circle cx="171" cy="63" r="2.5" fill="#BDEADD"/>
  <circle cx="-10" cy="116" r="2" fill="#BDEADD"/>
  <path d="M-220 0h32M188 0h32M0-220v32M0 188v32" stroke="#9ADBCB" stroke-opacity=".45"/>
</g>
<!-- identity -->
<text x="88" y="171" fill="#F1F5F9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="650" letter-spacing="-3">Hadriel</text>
<text x="91" y="210" fill="#9ADBCB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" letter-spacing="3.2">DEVELOPER  /  BUILDER  /  PHOTOGRAPHER</text>
<path d="M90 241H145" stroke="url(#mint)" stroke-width="2.5" stroke-linecap="round"/>
<text x="90" y="279" fill="#D0D9E4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Thoughtful systems.</text>
<text x="90" y="310" fill="#D0D9E4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Useful ideas. Creative perspective.</text>
<text x="90" y="361" fill="#8197A9" font-family="Consolas,monospace" font-size="11" letter-spacing="2">SOFTWARE · LOCAL AI · CREATIVE WORK</text>
<text x="1120" y="405" text-anchor="end" fill="#71889B" font-family="Consolas,monospace" font-size="9" letter-spacing="2">MAKE IT MEAN SOMETHING.</text>
</g>
</svg>