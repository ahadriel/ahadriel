<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hadriel — build with intention</title>
  <desc id="desc">A minimal midnight-navy banner with a soft seafoam eclipse and understated orbital lines.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080F1D"/>
      <stop offset="1" stop-color="#101B2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8E8DA"/>
      <stop offset="1" stop-color="#6EBEAE"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#78CDB9" stop-opacity=".18"/>
      <stop offset="1" stop-color="#78CDB9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#B5C7D9" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#background)"/>
  <rect width="1200" height="360" rx="18" fill="url(#dots)"/>
  <circle cx="930" cy="180" r="210" fill="url(#halo)"/>
  <g fill="none" stroke="#8CCFC0" stroke-width="1" opacity=".42">
    <ellipse cx="930" cy="180" rx="184" ry="68" transform="rotate(-28 930 180)"/>
    <ellipse cx="930" cy="180" rx="184" ry="68" transform="rotate(28 930 180)"/>
    <circle cx="930" cy="180" r="116" stroke-dasharray="2 9"/>
  </g>
  <circle cx="930" cy="180" r="69" fill="#0B1523" stroke="url(#accent)" stroke-width="1.5"/>
  <circle cx="930" cy="180" r="56" fill="none" stroke="#8CCFC0" stroke-opacity=".22"/>
  <circle cx="951" cy="160" r="43" fill="url(#accent)" opacity=".92"/>
  <circle cx="970" cy="145" r="43" fill="#0B1523"/>
  <circle cx="866" cy="121" r="3" fill="#B8E8DA"/>
  <circle cx="1060" cy="225" r="2.5" fill="#B8E8DA"/>
  <path d="M70 70h38M70 70v38M1130 290h-38M1130 290v-38" fill="none" stroke="#8CCFC0" stroke-width="1.5" opacity=".75"/>
  <text x="88" y="137" fill="#F1F5F9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="650" letter-spacing="-1.5">Hadriel</text>
  <rect x="90" y="158" width="34" height="2" rx="1" fill="#9ADBCB"/>
  <text x="90" y="196" fill="#A8DCCF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="2.8">DEVELOPER · BUILDER · PHOTOGRAPHER</text>
  <text x="90" y="237" fill="#C3CEDD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Thoughtful systems. Useful ideas. Creative perspective.</text>
  <text x="90" y="305" fill="#71839A" font-family="Consolas,monospace" font-size="11" letter-spacing="2">SOFTWARE  /  LOCAL AI  /  CREATIVE WORK</text>
</svg>