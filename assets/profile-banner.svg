<path d="M88 82h58" stroke="#55D6BE" stroke-width="3"/><text x="88" y="154" fill="#F4F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="1">HADriel</text>
