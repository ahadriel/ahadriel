<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">HADriel // Personal Interface</title>
<desc id="desc">A cybernetic HUD interface with a luminous central core, radar rings, telemetry, and futuristic developer identity.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".52" stop-color="#09162A"/><stop offset="1" stop-color="#160D2A"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3FFFD2"/><stop offset=".5" stop-color="#5CCBFF"/><stop offset="1" stop-color="#B18CFF"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#5CFFDF" stop-opacity=".28"/><stop offset="1" stop-color="#5CFFDF" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#80A7D8" stroke-opacity=".1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#bg)"/><rect width="1200" height="420" rx="22" fill="url(#grid)"/>
<circle cx="930" cy="205" r="260" fill="url(#core)"/>
